<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASON INVEST — Inscription — Public</title>
<style>
:root{--bg:#030711;--card:rgba(10,20,36,.88);--gold:#d8b45a;--gold-light:#f1d98b;--text:#fff;--muted:#8997aa;--border:rgba(216,180,90,.18);--green:#5ee49a;--red:#ff7c8d;}
*{box-sizing:border-box;}body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Arial;color:var(--text);background:radial-gradient(circle at 15% 20%,rgba(216,180,90,.09),transparent 25%),radial-gradient(circle at 85% 75%,rgba(69,130,255,.08),transparent 28%),linear-gradient(135deg,#030711,#07111f 50%,#040914);}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.18;animation:glowMove 10s ease-in-out infinite alternate;}.glow.one{top:-120px;left:-100px;background:#d8b45a;}.glow.two{right:-120px;bottom:-120px;background:#386cff;}.glow.three{top:45%;left:50%;width:180px;height:180px;background:#9c6cff;}
@keyframes glowMove{from{transform:translate(0,0) scale(1);}to{transform:translate(80px,40px) scale(1.25);}}
.particles{position:absolute;inset:0;}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-light);opacity:0;animation:particleFloat linear infinite;}
@keyframes particleFloat{0%{transform:translateY(110vh) scale(.4);opacity:0;}10%{opacity:.7;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.auth-page{position:relative;z-index:2;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px 15px;}
.auth-wrapper{width:100%;max-width:440px;animation:pageAppear .8s ease;}@keyframes pageAppear{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.auth-card{position:relative;width:100%;padding:30px 24px;border-radius:24px;background:var(--card);border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px);}
.logo-area{text-align:center;margin-bottom:18px;}.logo{width:76px;height:76px;margin:auto;display:flex;justify-content:center;align-items:center;border-radius:24px;background:linear-gradient(145deg,var(--gold-light),var(--gold));color:#07101d;font-size:24px;font-weight:900;}
.title{text-align:center;margin:0;font-size:29px;}.title span{color:var(--gold-light);}.subtitle{text-align:center;color:var(--muted);margin:8px 0 24px;font-size:14px;}
.gold-line{width:65px;height:3px;margin:0 auto 25px;border-radius:20px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.form-title{text-align:center;font-size:20px;margin:0 0 20px;}.form-group{margin-bottom:16px;}.form-group label{display:block;margin-bottom:7px;color:#c9d2df;font-size:13px;}
.form-group input{width:100%;height:49px;padding:0 14px;border-radius:12px;border:1px solid #26384f;background:#06101d;color:#fff;font-size:14px;outline:none;}.form-group input:focus{border-color:var(--gold);}
.terms{display:flex;gap:8px;color:var(--muted);font-size:12px;align-items:flex-start;}.terms input{margin-top:3px;}
.main-button{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#07101d;font-weight:900;font-size:15px;cursor:pointer;transition:.2s;}.main-button:disabled{opacity:.5;}
.message{display:none;padding:12px;margin-bottom:17px;border-radius:11px;text-align:center;font-size:13px;}.message.show{display:block;}.message.success{background:rgba(40,167,69,.12);color:var(--green);border:1px solid rgba(40,167,69,.25);}.message.error{background:rgba(220,53,69,.12);color:var(--red);border:1px solid rgba(220,53,69,.25);}.message.info{background:rgba(23,162,184,.12);color:#71d9e8;border:1px solid rgba(23,162,184,.25);}
.switch-area{text-align:center;margin-top:22px;}.switch-text{color:var(--muted);font-size:13px;}.switch-button{border:0;background:transparent;color:var(--gold-light);cursor:pointer;text-decoration:underline;font-size:14px;margin-top:4px;}
.footer{text-align:center;margin-top:17px;color:#526176;font-size:11px;}
</style>
</head>
<body>
<div class="background"><div class="glow one"></div><div class="glow two"></div><div class="glow three"></div><div class="particles" id="particles"></div></div>
<main class="auth-page"><div class="auth-wrapper"><div class="auth-card">
<div class="logo-area"><div class="logo">JI</div></div>
<h1 class="title">JASON <span>INVEST</span></h1><p class="subtitle">Créez votre compte — Public</p><div class="gold-line"></div>
<div id="message" class="message"></div>
<h2 class="form-title">Inscription</h2>
<form id="inscriptionForm">
<div class="form-group"><label>Nom complet</label><input type="text" id="name" placeholder="Jason Doe" required></div>
<div class="form-group"><label>Téléphone</label><input type="tel" id="phone" placeholder="+243..." required></div>
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="exemple@gmail.com" required></div>
<div class="form-group"><label>Mot de passe</label><input type="password" id="password" minlength="6" placeholder="Min 6 caractères" required></div>
<div class="form-group"><label>Confirmer mot de passe</label><input type="password" id="passwordConfirm" placeholder="Confirmer" required></div>
<div class="form-group"><label>Code parrain (facultatif)</label><input type="text" id="referral" placeholder="JAS-XXXXXX"></div>
<div class="form-group"><label class="terms"><input type="checkbox" id="terms" required> J'accepte les conditions JASON INVEST</label></div>
<button type="submit" id="btnReg" class="main-button">Créer mon compte PUBLIC</button>
</form>
<div class="switch-area"><div class="switch-text">Déjà un compte ?</div><a href="index.html" class="switch-button">Se connecter</a></div>
</div><div class="footer">© <span id="year"></span> JASON INVEST — Public</div></div></main>
<script type="module">
const $=id=>document.getElementById(id); $("year").textContent=new Date().getFullYear();
const particles=$("particles"); for(let i=0;i<32;i++){const p=document.createElement("span");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=(7+Math.random()*9)+"s";p.style.animationDelay=(-Math.random()*12)+"s";particles.appendChild(p);}
// récupère ref depuis URL auto
const urlParams=new URLSearchParams(window.location.search);
const refFromUrl=urlParams.get('ref')||urlParams.get('parrain')||"";
if(refFromUrl) $("referral").value=refFromUrl.toUpperCase();

function showMessage(t,c){const b=$("message");b.textContent=t;b.className="message show "+c;}
function getUsers(){return JSON.parse(localStorage.getItem('jason_users')||'[]');}
function saveUsers(u){localStorage.setItem('jason_users',JSON.stringify(u));}

$("inscriptionForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const name=$("name").value.trim(); const phone=$("phone").value.trim(); const email=$("email").value.trim().toLowerCase();
  const pass=$("password").value; const pass2=$("passwordConfirm").value;
  let ref=$("referral").value.trim().toUpperCase() || localStorage.getItem('jason_referred_by') || refFromUrl.toUpperCase() || "";

  if(pass!==pass2){showMessage("Mots de passe différents","error");return;}
  const btn=$("btnReg"); btn.disabled=true; btn.textContent="Création PUBLIC...";

  // CODE AUTO de l'utilisateur
  let myCode=localStorage.getItem('jason_my_referral_code');
  if(!myCode){ myCode='JAS-'+Math.random().toString(36).substring(2,6).toUpperCase(); localStorage.setItem('jason_my_referral_code', myCode); }

  const newUser={id:Date.now(), name, nom:name, phone, telephone:phone, numero:phone, email, password:pass, pass:pass, referral_code:ref, parrainCode:myCode, code_parrain:myCode, solde:0, balance:0, investment:0, date:new Date().toISOString(), createdAt:new Date().toISOString()};

  // 1. ESSAIE API PUBLIC
  try{
    const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,email,password:pass, referral:ref, myCode})});
    const j=await r.json();
    if(r.ok && j.success){
      if(j.user) localStorage.setItem('jason_current', JSON.stringify(j.user));
      else localStorage.setItem('jason_current', JSON.stringify(newUser));
      if(ref) localStorage.setItem('jason_referred_by', ref);
      showMessage("Compte créé PUBLIC !","success");
      setTimeout(()=>location.href="dashboard.html",800);
      return;
    }else if(j.message && j.message.includes("existe")) throw new Error("Email existe déjà");
  }catch(err){ console.warn("API fail fallback:",err); }

  // 2. FALLBACK + SYNC CACHE Firebase + API
  try{
    const users=getUsers(); if(users.find(u=>u.email===email)){showMessage("Email existe déjà","error");btn.disabled=false;btn.textContent="Créer mon compte PUBLIC";return;}
    users.push(newUser); saveUsers(users);
    localStorage.setItem('jason_current', JSON.stringify(newUser));
    if(ref) localStorage.setItem('jason_referred_by', ref);

    // sync caché
    try{ await fetch("/api/index.js?action=sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({users})}); }catch{}
    try{
      const {db}=await import("./backend/firebase.js");
      const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
      await setDoc(doc(db,"users",String(newUser.id)), newUser, {merge:true});
      if(ref){
        await setDoc(doc(db,"parrainages_pending",String(newUser.id)),{filleulId:newUser.id, filleulName:name, parrainCode:ref, date:new Date().toISOString()},{merge:true});
      }
    }catch{}
    showMessage("Compte créé !","success");
    setTimeout(()=>location.href="dashboard.html",900);
  }catch{
    showMessage("Erreur création","error");
    btn.disabled=false; btn.textContent="Créer mon compte PUBLIC";
  }
});
</script></body></html>
