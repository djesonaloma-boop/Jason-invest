<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASON INVEST — Accueil</title>
<style>
:root{--bg:#030711;--card:rgba(10,20,36,.88);--gold:#d8b45a;--gold-light:#f1d98b;--text:#fff;--muted:#8997aa;--border:rgba(216,180,90,.18);}
*{box-sizing:border-box} body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Arial;color:var(--text);background:radial-gradient(circle at 15% 20%,rgba(216,180,90,.09),transparent 25%),radial-gradient(circle at 85% 75%,rgba(69,130,255,.08),transparent 28%),linear-gradient(135deg,#030711,#07111f 50%,#040914);}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.18;animation:glowMove 10s ease-in-out infinite alternate;}
.glow.one{top:-120px;left:-100px;background:#d8b45a;} .glow.two{right:-120px;bottom:-120px;background:#386cff;}
.glow.three{top:45%;left:50%;width:180px;height:180px;background:#9c6cff;}
@keyframes glowMove{from{transform:translate(0,0) scale(1);}to{transform:translate(80px,40px) scale(1.25);}}
.particles{position:absolute;inset:0;} .particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-light);opacity:0;animation:particleFloat linear infinite;}
@keyframes particleFloat{0%{transform:translateY(110vh) scale(.4);opacity:0;}10%{opacity:.7;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.auth-page{position:relative;z-index:2;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px 15px;}
.auth-wrapper{width:100%;max-width:440px;animation:pageAppear .8s ease;}
@keyframes pageAppear{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.auth-card{width:100%;padding:30px 24px;border-radius:24px;background:var(--card);border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px);text-align:center}
.logo-area{margin-bottom:18px;} .logo{width:76px;height:76px;margin:auto;display:flex;justify-content:center;align-items:center;border-radius:24px;background:linear-gradient(145deg,var(--gold-light),var(--gold));color:#07101d;font-size:24px;font-weight:900;box-shadow:0 12px 35px rgba(216,180,90,.2);}
.title{margin:0;font-size:29px;} .title span{color:var(--gold-light);} .subtitle{color:var(--muted);margin:8px 0 24px;font-size:14px;line-height:1.6}
.gold-line{width:65px;height:3px;margin:0 auto 25px;border-radius:20px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.main-button{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#07101d;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:12px}
.ghost-button{width:100%;height:50px;border-radius:13px;border:1px solid #26384f;background:#06101d;color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.footer{text-align:center;margin-top:17px;color:#526176;font-size:11px;}
</style>
</head>
<body>
<div class="background"><div class="glow one"></div><div class="glow two"></div><div class="glow three"></div><div class="particles" id="particles"></div></div>
<main class="auth-page"><div class="auth-wrapper"><div class="auth-card">
<div class="logo-area"><div class="logo">JI</div></div>
<h1 class="title">JASON <span>INVEST</span></h1>
<p class="subtitle">Votre espace personnel — Public<br>Investissement en Franc Congolais FC</p>
<div class="gold-line"></div>

<a href="login.html" class="main-button">Se connecter</a>
<a href="register.html" class="ghost-button">Créer un compte</a>

</div><div class="footer">© <span id="year"></span> JASON INVEST - Public</div></div></main>
<script>
document.getElementById("year").textContent=new Date().getFullYear();
const p=document.getElementById("particles");
for(let i=0;i<32;i++){const el=document.createElement("span");el.className="particle";el.style.left=Math.random()*100+"%";el.style.animationDuration=(7+Math.random()*9)+"s";el.style.animationDelay=(-Math.random()*12)+"s";p.appendChild(el);}
</script>
</body>
</html>
