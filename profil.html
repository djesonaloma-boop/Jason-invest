<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — JASON INVEST — Public</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#050912;--gold:#d8b45a;--gold-light:#f3dc91;--text:#f5f7fb;--muted:#8d9bb0;--green:#32d583;}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#030711,#07101e);color:var(--text);min-height:100vh;}
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(5,11,22,.9);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:500;}
.back{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;}
.wrap{max-width:520px;margin:0 auto;padding:18px;}
.hero{display:flex;gap:14px;align-items:center;padding:18px;border-radius:18px;background:rgba(9,17,30,.9);border:1px solid rgba(255,255,255,.07);margin-top:10px;}
.avatar{width:68px;height:68px;border-radius:50%;background:#12223a;border:3px solid rgba(216,180,90,.45);display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-weight:900;font-size:28px;flex-shrink:0;}
.card{margin-top:14px;padding:18px;border-radius:16px;background:rgba(9,17,30,.9);border:1px solid rgba(255,255,255,.07);}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);}.row:last-child{border:0;}
.row span{color:var(--muted);font-size:12px;}.row strong{font-size:13px;word-break:break-all;}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(216,180,90,.18);background:#0a1424;color:#fff;margin-top:6px;outline:none;}
.input:focus{border-color:var(--gold);}
.btn{width:100%;padding:13px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#111;font-weight:800;cursor:pointer;margin-top:10px;transition:.2s;}
.btn:disabled{opacity:.5;}
</style>
</head>
<body>
<div class="top"><a href="dashboard.html" class="back"><i class="fa-solid fa-arrow-left"></i></a><div><strong>Mon Profil — Public</strong><div style="font-size:10px;color:var(--muted);">JASON INVEST</div></div></div>
<div class="wrap">
<div class="hero"><div class="avatar" id="avatar">J</div><div><h2 id="nameDisplay">...</h2><p id="phoneDisplay" style="font-size:13px;color:var(--gold-light);margin-top:3px;">...</p><p id="emailDisplay" style="font-size:11px;color:var(--muted);margin-top:2px;">...</p></div></div>
<div class="card"><div class="row"><span>Nom complet</span><strong id="infoName">...</strong></div><div class="row"><span>Numéro</span><strong id="infoPhone">...</strong></div><div class="row"><span>Email</span><strong id="infoEmail">...</strong></div><div class="row"><span>Solde PUBLIC</span><strong id="infoSolde" style="color:var(--gold-light);">...</strong></div><div class="row"><span>Code parrainage auto</span><strong id="infoCode" style="color:var(--gold-light);">...</strong></div><div class="row"><span>ID</span><strong id="infoId">...</strong></div></div>
<div class="card"><h3 style="font-size:14px;margin-bottom:10px;"><i class="fa-solid fa-pen"></i> Corriger mon profil PUBLIC</h3><p style="font-size:11px;color:var(--muted);line-height:1.5;">Corrige ici, ça s'enregistre en ligne (Firebase + API).</p><input class="input" id="editName" placeholder="Nom complet"><input class="input" id="editPhone" placeholder="+243..."><input class="input" id="editEmail" placeholder="Email"><button class="btn" id="saveBtn" onclick="saveProfile()">💾 Enregistrer PUBLIC</button><div id="msg" style="font-size:12px;text-align:center;margin-top:10px;color:var(--green);"></div></div>
</div>
<script type="module">
function money(v){return Number(v||0).toLocaleString('fr-FR')+" FC";}
function getCur(){try{return JSON.parse(localStorage.getItem('jason_current')||'null');}catch{return null;}}
function getUsers(){try{return JSON.parse(localStorage.getItem('jason_users')||'[]');}catch{return [];}}
function extractName(o){return o.name||o.nom||o.fullName||o.username||"";}
function extractPhone(o){return o.phone||o.telephone||o.numero||o.tel||"";}

async function load(){
  let cur=getCur(); if(!cur){ location.href="index.html"; return; }
  // essaie PUBLIC
  try{
    const {db}=await import("./backend/firebase.js");
    const {doc,getDoc}=await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
    const snap=await getDoc(doc(db,"users",String(cur.id)));
    if(snap.exists()){
      const data=snap.data();
      cur={...cur,...data};
      localStorage.setItem('jason_current', JSON.stringify(cur));
    }
  }catch{}
  try{
    const r=await fetch("/api/index.js?action=me&email="+cur.email);
    if(r.ok){ const j=await r.json(); if(j.user){ cur={...cur,...j.user}; localStorage.setItem('jason_current',JSON.stringify(cur)); } }
  }catch{}

  let myCode=localStorage.getItem('jason_my_referral_code')||'JAS-'+Math.random().toString(36).substring(2,6).toUpperCase();
  localStorage.setItem('jason_my_referral_code', myCode);

  const name=extractName(cur)||'Utilisateur';
  const phone=extractPhone(cur)||'Non enregistré';
  const email=cur.email||'';

  document.getElementById('avatar').textContent=name.charAt(0).toUpperCase();
  document.getElementById('nameDisplay').textContent=name;
  document.getElementById('phoneDisplay').textContent=phone;
  document.getElementById('emailDisplay').textContent=email;
  document.getElementById('infoName').textContent=name;
  document.getElementById('infoPhone').textContent=phone;
  document.getElementById('infoEmail').textContent=email||"—";
  document.getElementById('infoSolde').textContent=money(cur.solde||cur.balance||0);
  document.getElementById('infoCode').textContent=myCode;
  document.getElementById('infoId').textContent=cur.id||"—";
  document.getElementById('editName').value=extractName(cur);
  document.getElementById('editPhone').value=extractPhone(cur);
  document.getElementById('editEmail').value=email;
}

window.saveProfile=async function(){
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent="Enregistrement...";
  let cur=getCur(); if(!cur) return;
  let users=getUsers(); let idx=users.findIndex(u=>u.id===cur.id); if(idx===-1) idx=0;
  const newName=document.getElementById('editName').value.trim();
  const newPhone=document.getElementById('editPhone').value.trim();
  const newEmail=document.getElementById('editEmail').value.trim();

  cur.name=newName; cur.nom=newName; cur.username=newName;
  cur.phone=newPhone; cur.telephone=newPhone; cur.numero=newPhone;
  cur.email=newEmail;

  if(users[idx]) users[idx]={...users[idx],...cur}; else users.push(cur);
  localStorage.setItem('jason_users', JSON.stringify(users));
  localStorage.setItem('jason_current', JSON.stringify(cur));

  // PUBLIC sync caché
  try{ await fetch("/api/index.js?action=profile_update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:cur})}); }catch{}
  try{
    const {db}=await import("./backend/firebase.js");
    const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
    await setDoc(doc(db,"users",String(cur.id)),{name:newName, phone:newPhone, email:newEmail, nom:newName, telephone:newPhone, updatedAt:new Date().toISOString()},{merge:true});
    document.getElementById('msg').textContent="✅ PUBLIC enregistré!";
  }catch(e){
    document.getElementById('msg').textContent="✅ Enregistré local (Firebase à configurer)";
  }
  btn.disabled=false; btn.textContent="💾 Enregistrer PUBLIC";
  setTimeout(()=>load(),600);
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
